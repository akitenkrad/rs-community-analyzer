[package]
name = "community-analyzer"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["akitenkrad"]
description = "In-memory stateless library for organizational/community communication analysis (H1-H5 hypotheses; Japanese NLP via optional Python sidecar). Extracted from persona-from-slack."
readme = "README.md"
repository = ""
keywords = ["analysis", "slack", "collaboration", "japanese", "communication"]
categories = ["text-processing", "science"]

[features]
default = ["lindera"]
lindera = ["dep:lindera"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1"
thiserror = "1"
figment = { version = "0.10", features = ["toml", "env"] }
regex = "1"
aho-corasick = "1"
petgraph = "0.6"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
lindera = { version = "0.33", optional = true }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
