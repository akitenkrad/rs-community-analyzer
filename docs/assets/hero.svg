<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="community-analyzer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1021"/>
      <stop offset="1" stop-color="#172a44"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DC863"/>
      <stop offset="0.5" stop-color="#21908C"/>
      <stop offset="1" stop-color="#3B528B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#21908C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#21908C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <ellipse cx="930" cy="180" rx="320" ry="240" fill="url(#glow)"/>

  <!-- left: wordmark + tagline -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="150" font-size="62" font-weight="700" fill="url(#title)">community-analyzer</text>
    <text x="74" y="196" font-size="23" font-weight="400" fill="#c8d4e3">Stateless organizational &amp; community communication analysis</text>
    <text x="74" y="228" font-size="23" font-weight="400" fill="#c8d4e3">Pure-Rust · five-hypothesis health metrics · candle NLP</text>

    <!-- hypothesis chips -->
    <g font-size="18" font-weight="600">
      <g transform="translate(74,266)">
        <rect width="58" height="34" rx="17" fill="#440154"/><text x="29" y="23" fill="#f3e9ff" text-anchor="middle">H1</text>
      </g>
      <g transform="translate(142,266)">
        <rect width="58" height="34" rx="17" fill="#3B528B"/><text x="29" y="23" fill="#eaf0ff" text-anchor="middle">H2</text>
      </g>
      <g transform="translate(210,266)">
        <rect width="58" height="34" rx="17" fill="#21908C"/><text x="29" y="23" fill="#e7fbf8" text-anchor="middle">H3</text>
      </g>
      <g transform="translate(278,266)">
        <rect width="58" height="34" rx="17" fill="#5DC863"/><text x="29" y="23" fill="#0b1021" text-anchor="middle">H4</text>
      </g>
      <g transform="translate(346,266)">
        <rect width="58" height="34" rx="17" fill="#FDE725"/><text x="29" y="23" fill="#0b1021" text-anchor="middle">H5</text>
      </g>
    </g>
  </g>

  <!-- right: stylized reply network (node size ~ centrality) -->
  <g stroke="#21908C" stroke-opacity="0.5" stroke-width="2">
    <line x1="930" y1="120" x2="820" y2="200"/>
    <line x1="930" y1="120" x2="1040" y2="190"/>
    <line x1="930" y1="120" x2="960" y2="250"/>
    <line x1="820" y1="200" x2="960" y2="250"/>
    <line x1="1040" y1="190" x2="1080" y2="270"/>
    <line x1="960" y1="250" x2="1080" y2="270"/>
    <line x1="820" y1="200" x2="760" y2="120"/>
  </g>
  <g>
    <circle cx="930" cy="120" r="30" fill="#FDE725"/>
    <circle cx="820" cy="200" r="20" fill="#5DC863"/>
    <circle cx="1040" cy="190" r="18" fill="#21908C"/>
    <circle cx="960" cy="250" r="16" fill="#3B528B"/>
    <circle cx="1080" cy="270" r="12" fill="#3B528B"/>
    <circle cx="760" cy="120" r="12" fill="#440154" stroke="#5DC863" stroke-width="2"/>
  </g>
</svg>
