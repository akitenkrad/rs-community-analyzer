[project]
name = "comm-nlp-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.45",
    "torch>=2.5",
    "sentence-transformers>=3.2",
    "hdbscan>=0.8.40",
    "umap-learn>=0.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
